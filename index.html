<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:#0B0917;
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    -webkit-user-select:none;user-select:none;touch-action:none;overscroll-behavior:none}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
  #st,#sb{position:fixed;left:0;width:0}
  #st{top:0;height:env(safe-area-inset-top,0px)}
  #sb{bottom:0;height:env(safe-area-inset-bottom,0px)}
</style>
<div id="st"></div><div id="sb"></div>
<canvas id="c"></canvas>
<script>
(() => {
  // ---- sabitler --------------------------------------------------------
  const W = 450;            // mantıksal genişlik sabit, yükseklik cihaza göre
  let H = 800, safeTop = 0, safeBot = 0;
  const WALL = 16;
  const FLOOR_H = 88;
  const G = 2300;
  const JUMP_VY = 1085;     // sabit zıplama gücü — yaklaşık 2,9 kat
  const SPD_MIN = 250;      // başlangıç koşu hızı
  const SPD_MAX = 545;      // yükseldikçe ulaşılan tavan
  const SPD_RAMP = 2.4;     // kat başına hız artışı
  const TURN = 9;           // yön tuşuna tepki keskinliği
  const SLOW = 0.14;        // tuş bırakınca saniyede kalan hız oranı
  const WALL_KEEP = 0.5;
  const CHAIN_WIN = 0.6;    // zinciri koruma penceresi (sn)

  const PRAISE = ['GÜZEL','HARİKA','MÜKEMMEL','İNANILMAZ','EFSANE','DURDURULAMAZ'];

  const C = {
    bgTop:'#0B0917', bgBot:'#221B44', wall:'#181330', wallLine:'#241C48',
    stone:'#3C3563', stoneTop:'#6C61A6', mark:'#8A7FD1',
    amber:'#FFB454', hot:'#FF7A59', text:'#EDE9FF', dim:'#6E6494'
  };

  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const st = document.getElementById('st'), sb = document.getElementById('sb');

  function resize(){
    const cw = cv.clientWidth || window.innerWidth;
    const ch = cv.clientHeight || window.innerHeight;
    const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    cv.width = cw*dpr; cv.height = ch*dpr;
    const s = cw*dpr/W;                       // 1 mantıksal birim = s fiziksel piksel
    ctx.setTransform(s,0,0,s,0,0);
    H = ch * W / cw;                          // yükseklik ekran oranından türetiliyor
    safeTop = st.getBoundingClientRect().height * W / cw;
    safeBot = sb.getBoundingClientRect().height * W / cw;
  }

  let p, plats, camY, rise, score, best=0, maxFloor, over, shake, pops, dust, t, side, heat;

  function reset(){
    p = { x:W/2, y:0, vx:0, vy:0, dir:1, takeoff:0, lastLand:0, chain:0, squash:1 };
    plats = [{ x:WALL, y:0, w:W-2*WALL, floor:0 }];
    camY = -0.62*H; rise = 0; score = 0; maxFloor = 0; over = false;
    shake = 0; pops = []; dust = []; t = 0; side = 1; heat = 0;
    grow();
  }

  function grow(){
    let top = plats[plats.length-1];
    while (top.y > camY - 400) {
      const f = top.floor + 1;
      const big = f % 10 === 0;
      let w = big ? W-2*WALL-40 : Math.max(74, 200 - f*1.0) + Math.random()*36;
      w = Math.min(w, W-2*WALL-24);
      const span = W-2*WALL-24-w;
      let x;
      if (big) x = WALL+12+span/2;
      else { side = -side;
        x = WALL + 12 + (side > 0 ? span*(0.5+Math.random()*0.5) : span*Math.random()*0.5); }
      plats.push({ x, y:-f*FLOOR_H, w, floor:f });
      top = plats[plats.length-1];
    }
    while (plats.length && plats[0].y - camY > H + 200) plats.shift();
  }

  // ---- girdi: sadece sağ / sol ------------------------------------------
  let keyDir = 0;
  const holds = new Map();

  function btnRects(){
    const size = 118, y = H - safeBot - 150;
    return [{ d:-1, x:26, y, w:size, h:size }, { d:1, x:W-26-size, y, w:size, h:size }];
  }
  function hit(cx, cy){
    const r = cv.getBoundingClientRect();
    const x = (cx - r.left) / r.width * W, y = (cy - r.top) / r.height * H;
    for (const b of btnRects())
      if (x > b.x-18 && x < b.x+b.w+18 && y > b.y-18 && y < b.y+b.h+18) return b.d;
    return 0;
  }

  cv.addEventListener('pointerdown', e => {
    e.preventDefault();
    if (over) { reset(); return; }
    const d = hit(e.clientX, e.clientY);
    if (d) { holds.set(e.pointerId, d); cv.setPointerCapture(e.pointerId); }
  });
  cv.addEventListener('pointermove', e => {
    if (!holds.has(e.pointerId)) return;
    const d = hit(e.clientX, e.clientY);
    if (d) holds.set(e.pointerId, d); else holds.delete(e.pointerId);
  });
  const release = e => holds.delete(e.pointerId);
  cv.addEventListener('pointerup', release);
  cv.addEventListener('pointercancel', release);

  addEventListener('keydown', e => {
    if (e.code === 'ArrowLeft') keyDir = -1;
    if (e.code === 'ArrowRight') keyDir = 1;
    if (e.code === 'Space' && over) reset();
  });
  addEventListener('keyup', e => {
    if (e.code === 'ArrowLeft' && keyDir === -1) keyDir = 0;
    if (e.code === 'ArrowRight' && keyDir === 1) keyDir = 0;
  });

  function inputDir(){
    if (keyDir) return keyDir;
    let d = 0; for (const v of holds.values()) d += v;
    return Math.max(-1, Math.min(1, d));
  }

  function puff(x,y,n,sp){
    for (let i=0;i<n;i++) dust.push({x,y,vx:(Math.random()-.5)*(sp||140),vy:-Math.random()*90,life:.4});
  }

  // ---- güncelleme ------------------------------------------------------
  function step(dt){
    t += dt;
    if (over) { decay(dt); return; }

    heat = Math.max(0, heat - dt*0.40);          // kombo bırakınca ısı soğur

    const spd = curSpeed();                      // hızı oyun belirliyor, sen değil
    const inp = inputDir();
    if (inp !== 0) { p.vx += (inp*spd - p.vx) * Math.min(1, dt*TURN); p.dir = inp; }
    else p.vx *= Math.pow(SLOW, dt);

    p.vy += G * dt;
    p.x += p.vx * dt;
    const prevY = p.y;
    p.y += p.vy * dt;

    if (p.x - 12 < WALL) {
      p.x = WALL+12; p.vx = Math.abs(p.vx)*WALL_KEEP;
      shake = Math.max(shake, Math.abs(p.vx)/110); puff(p.x, p.y-16, 4, 60);
    }
    if (p.x + 12 > W-WALL) {
      p.x = W-WALL-12; p.vx = -Math.abs(p.vx)*WALL_KEEP;
      shake = Math.max(shake, Math.abs(p.vx)/110); puff(p.x, p.y-16, 4, 60);
    }

    // otomatik zıplama: her inişte kendiliğinden sekiyor
    if (p.vy > 0) {
      for (const q of plats) {
        if (prevY <= q.y + 1 && p.y >= q.y && p.x + 11 > q.x && p.x - 11 < q.x + q.w) {
          p.y = q.y;
          land(q.floor);
          p.vy = -JUMP_VY;
          p.takeoff = q.floor;
          p.squash = 0.72;
          break;
        }
      }
    }

    camY = Math.min(camY, p.y - 0.62*H);
    if (maxFloor >= 5) { rise = Math.min(340, 30 + maxFloor*1.8) * (1 + heat*0.25); camY -= rise * dt; }
    grow();
    if (p.y - camY > H + 30) { over = true; shake = 6; }

    decay(dt);
  }

  // hız kata ve kombo ısısına bağlı; oyuncunun doğrudan kontrolünde değil
  function curSpeed(){
    return Math.min(SPD_MAX, SPD_MIN + maxFloor*SPD_RAMP) * (1 + heat*0.35);
  }

  function decay(dt){
    p.squash += (1 - p.squash) * Math.min(1, dt*14);
    shake *= Math.pow(0.001, dt);
    for (const d of dust) { d.life -= dt; d.x += d.vx*dt; d.y += d.vy*dt; d.vy += 400*dt; }
    dust = dust.filter(d => d.life > 0);
    for (const q of pops) { q.life -= dt; q.y -= 26*dt; }
    pops = pops.filter(q => q.life > 0);
  }

  function land(f){
    const gain = f - p.takeoff;
    if (f > maxFloor) maxFloor = f;
    puff(p.x, p.y, gain >= 2 ? 7 : 3, gain >= 2 ? 200 : 140);

    if (gain >= 2) {
      p.chain = (t - p.lastLand < CHAIN_WIN) ? p.chain + 1 : 1;
      heat = Math.min(1, heat + 0.22);
      score += gain * gain * 6 * p.chain;
      const word = PRAISE[Math.min(PRAISE.length-1, gain - 2 + Math.floor(p.chain/3))];
      pops.push({ x:W/2, y:p.y - 120, txt:word, sub:p.chain > 1 ? 'x'+p.chain : '', life:1 });
      shake = Math.max(shake, 1.5 + gain*0.4);
    } else {
      if (t - p.lastLand >= CHAIN_WIN) p.chain = 0;
      score += Math.max(0, gain);
    }
    p.lastLand = t;
    if (score > best) best = score;
  }

  // ---- çizim -----------------------------------------------------------
  function draw(){
    ctx.save(); ctx.translate((Math.random()-.5)*shake, (Math.random()-.5)*shake);

    const g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0, C.bgTop);
    g.addColorStop(1, heat > 0.05 ? mix(C.bgBot, '#4A2140', heat) : C.bgBot);
    ctx.fillStyle = g; ctx.fillRect(-10,-10,W+20,H+20);

    ctx.fillStyle = C.wall;
    ctx.fillRect(0,0,WALL,H); ctx.fillRect(W-WALL,0,WALL,H);
    ctx.strokeStyle = C.wallLine; ctx.lineWidth = 2;
    const off = ((-camY) % 34);
    for (let y = off - 34; y < H; y += 34) {
      ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(WALL,y);
      ctx.moveTo(W-WALL,y+17); ctx.lineTo(W,y+17); ctx.stroke();
    }

    for (const q of plats) {
      const y = q.y - camY;
      if (y < -30 || y > H + 30) continue;
      ctx.fillStyle = C.stone; round(q.x, y, q.w, 15, 5); ctx.fill();
      ctx.fillStyle = C.stoneTop; round(q.x, y, q.w, 4, 2); ctx.fill();
      if (q.floor % 10 === 0 && q.floor > 0) {
        ctx.fillStyle = C.mark; ctx.font = '600 12px ui-monospace,monospace';
        ctx.textAlign = 'center'; ctx.fillText(q.floor, q.x + q.w/2, y + 13);
      }
    }

    for (const d of dust) {
      ctx.globalAlpha = Math.max(0, d.life*2);
      ctx.fillStyle = C.dim; ctx.fillRect(d.x-2, d.y-camY-2, 4, 4);
    }
    ctx.globalAlpha = 1;

    const py = p.y - camY, sq = p.squash, w = 24/sq, h = 34*sq;
    ctx.save();
    ctx.shadowColor = heat > 0.4 ? C.hot : C.amber; ctx.shadowBlur = 24 + heat*26;
    ctx.fillStyle = heat > 0.4 ? mix(C.amber, C.hot, (heat-0.4)/0.6) : C.amber;
    round(p.x - w/2, py - h, w, h, 7); ctx.fill();
    ctx.restore();
    ctx.fillStyle = '#3A2408';
    ctx.fillRect(p.x - 5 + p.dir*4, py - h + 9, 3, 4);
    ctx.fillRect(p.x + 2 + p.dir*4, py - h + 9, 3, 4);

    // övgü yazıları
    for (const q of pops) {
      const k = 1 - q.life, sc = 1 + Math.max(0, 0.5 - k*3);
      ctx.globalAlpha = Math.min(1, q.life*2.2);
      ctx.save(); ctx.translate(q.x, q.y - camY); ctx.scale(sc, sc);
      ctx.textAlign = 'center'; ctx.fillStyle = C.hot;
      ctx.font = '800 34px ui-monospace,monospace';
      ctx.fillText(q.txt, 0, 0);
      if (q.sub) { ctx.fillStyle = C.amber; ctx.font = '800 22px ui-monospace,monospace';
        ctx.fillText(q.sub, 0, 28); }
      ctx.restore();
    }
    ctx.globalAlpha = 1;

    // yön tuşları
    for (const b of btnRects()) {
      const on = inputDir() === b.d;
      ctx.fillStyle = on ? 'rgba(255,180,84,.20)' : 'rgba(255,255,255,.07)';
      round(b.x, b.y, b.w, b.h, 26); ctx.fill();
      ctx.fillStyle = on ? C.amber : C.dim;
      ctx.font = '700 30px ui-monospace,monospace'; ctx.textAlign = 'center';
      ctx.fillText(b.d < 0 ? '◀' : '▶', b.x + b.w/2, b.y + b.h/2 + 11);
    }

    // ısı çubuğu — kombo zinciri sürdükçe dolar, oyun hızlanır
    const barY = H - safeBot - 22;
    ctx.fillStyle = 'rgba(255,255,255,.10)';
    round(WALL+14, barY, W-2*WALL-28, 8, 4); ctx.fill();
    ctx.fillStyle = heat > 0.4 ? C.hot : C.amber;
    round(WALL+14, barY, (W-2*WALL-28)*heat, 8, 4); ctx.fill();
    ctx.fillStyle = C.dim; ctx.font = '600 10px ui-monospace,monospace';
    ctx.textAlign = 'left'; ctx.fillText('ISI', WALL+14, barY - 6);

    const hy = safeTop + 46;
    ctx.textAlign = 'left'; ctx.fillStyle = C.text;
    ctx.font = '700 30px ui-monospace,monospace'; ctx.fillText(score, WALL+16, hy);
    ctx.font = '600 12px ui-monospace,monospace'; ctx.fillStyle = C.dim;
    ctx.fillText('PUAN', WALL+16, hy+16);
    ctx.textAlign = 'right'; ctx.fillStyle = C.text;
    ctx.font = '700 30px ui-monospace,monospace'; ctx.fillText(maxFloor, W-WALL-16, hy);
    ctx.font = '600 12px ui-monospace,monospace'; ctx.fillStyle = C.dim;
    ctx.fillText('KAT · REKOR ' + best, W-WALL-16, hy+16);

    if (over) {
      ctx.fillStyle = 'rgba(11,9,23,.86)'; ctx.fillRect(0,0,W,H);
      ctx.textAlign = 'center'; ctx.fillStyle = C.text;
      ctx.font = '700 34px ui-monospace,monospace';
      ctx.fillText('DÜŞTÜN', W/2, H/2 - 40);
      ctx.font = '600 16px ui-monospace,monospace'; ctx.fillStyle = C.dim;
      ctx.fillText(maxFloor + '. kat · ' + score + ' puan', W/2, H/2 - 8);
      ctx.fillStyle = C.amber; ctx.font = '700 16px ui-monospace,monospace';
      ctx.fillText('yeniden başlamak için dokun', W/2, H/2 + 40);
    } else if (maxFloor === 0 && t < 6) {
      ctx.globalAlpha = Math.max(0, 1 - t/6);
      ctx.textAlign = 'center'; ctx.fillStyle = C.dim;
      ctx.font = '600 14px ui-monospace,monospace';
      ctx.fillText('tek işin sağ ve sol', W/2, H*0.42);
      ctx.fillText('zıplamayı da hızı da oyun ayarlıyor', W/2, H*0.42 + 24);
      ctx.fillText('hep bir üstteki basamağa yetiş', W/2, H*0.42 + 48);
      ctx.globalAlpha = 1;
    }
    ctx.restore();
  }

  function mix(a, b, k){
    const pa = [1,3,5].map(i => parseInt(a.substr(i,2),16));
    const pb = [1,3,5].map(i => parseInt(b.substr(i,2),16));
    return 'rgb(' + pa.map((v,i) => Math.round(v + (pb[i]-v)*k)).join(',') + ')';
  }

  function round(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
  }

  let last = performance.now();
  function loop(now){
    const dt = Math.min(0.033, (now - last)/1000); last = now;
    step(dt); draw();
    requestAnimationFrame(loop);
  }
  resize(); addEventListener('resize', resize);
  addEventListener('orientationchange', () => setTimeout(resize, 120));
  reset(); requestAnimationFrame(loop);
})();
</script>
