<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:#0B0917;overflow:hidden;
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    -webkit-user-select:none;user-select:none;touch-action:none}
  #wrap{height:100%;display:flex;align-items:center;justify-content:center}
  canvas{display:block;max-width:100%;max-height:100%;aspect-ratio:450/800;
    border-radius:14px;box-shadow:0 0 60px rgba(255,180,84,.07)}
</style>
<div id="wrap"><canvas id="c"></canvas></div>
<script>
(() => {
  // ---- sabitler --------------------------------------------------------
  const W = 450, H = 800;
  const WALL = 16;
  const FLOOR_H = 88;
  const G = 2300;
  const MAX_VX = 520;
  const ACC = 1250;
  const AIR = 0.62;
  const JUMP_BASE = 730;
  const JUMP_K = 1.25;
  const WALL_KEEP = 1.00;   // duvardan sekerken hiç hız kaybı yok
  const LAND_LOSS = 0.95;   // normal inişte küçük hız kaybı
  const DIVE_GAIN = 1.20;   // dalışla inince hız çarpanı
  const DIVE_VY = 1250;
  const COYOTE = 0.09, BUFFER = 0.13, CHAIN_WIN = 0.45;

  const C = {
    bgTop:'#0B0917', bgBot:'#221B44', wall:'#181330', wallLine:'#241C48',
    stone:'#3C3563', stoneTop:'#6C61A6', mark:'#8A7FD1',
    amber:'#FFB454', text:'#EDE9FF', dim:'#6E6494'
  };

  // ---- kurulum ---------------------------------------------------------
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  function resize(){
    const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    cv.width = W*dpr; cv.height = H*dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  resize(); addEventListener('resize', resize);

  let p, plats, camY, rise, score, best=0, maxFloor, over, shake, pops, dust, t, side;

  function reset(){
    p = { x:W/2, y:0, vx:240, vy:0, dir:1, ground:true, coyote:0, buffer:0,
          dive:false, takeoff:0, lastLand:0, chain:0, squash:1 };
    plats = [{ x:WALL, y:0, w:W-2*WALL, floor:0 }];
    camY = -0.62*H; rise = 0; score = 0; maxFloor = 0; over = false;
    shake = 0; pops = []; dust = []; t = 0; side = 1;
    grow();
  }

  // platformlar dönüşümlü olarak sağa-sola yerleşir; zikzak rota her zaman mevcut
  function grow(){
    let top = plats[plats.length-1];
    while (top.y > camY - 400) {
      const f = top.floor + 1;
      const big = f % 10 === 0;
      let w = big ? W-2*WALL-40 : Math.max(72, 200 - f*1.0) + Math.random()*36;
      w = Math.min(w, W-2*WALL-24);
      const span = W-2*WALL-24-w;
      let x;
      if (big) { x = WALL+12+span/2; }
      else {
        side = -side;
        x = WALL + 12 + (side > 0 ? span*(0.5+Math.random()*0.5) : span*Math.random()*0.5);
      }
      plats.push({ x, y:-f*FLOOR_H, w, floor:f });
      top = plats[plats.length-1];
    }
    while (plats.length && plats[0].y - camY > H + 200) plats.shift();
  }

  // ---- girdi: tek parmak, tek kural ------------------------------------
  // Yerdeyken dokun  = zıpla
  // Havadayken dokun = dalış (hızlı in, hızını koru)
  function tap(){
    if (over) { reset(); return; }
    if (p.ground || p.coyote > 0) p.buffer = BUFFER;
    else if (!p.dive && p.vy > -260) { p.dive = true; p.vy = DIVE_VY; p.squash = 1.4; }
  }
  cv.addEventListener('pointerdown', e => { e.preventDefault(); tap(); });
  addEventListener('keydown', e => {
    if (e.repeat) return;
    if (e.code === 'Space' || e.code === 'ArrowDown' || e.code === 'ArrowUp') { e.preventDefault(); tap(); }
  });

  // ---- efektler --------------------------------------------------------
  function puff(x,y,n,sp){
    for (let i=0;i<n;i++) dust.push({x,y,vx:(Math.random()-.5)*(sp||140),vy:-Math.random()*90,life:.4});
  }
  function pop(x,y,txt){ pops.push({x,y,txt,life:.85}); }

  // ---- güncelleme ------------------------------------------------------
  function step(dt){
    t += dt;
    if (over) { decay(dt); return; }

    p.buffer = Math.max(0, p.buffer - dt);
    p.coyote = p.ground ? COYOTE : Math.max(0, p.coyote - dt);

    // otomatik koşu — yön oyuncunun derdi değil
    p.vx += p.dir * ACC * (p.ground ? 1 : AIR) * dt;
    p.vx = Math.max(-MAX_VX, Math.min(MAX_VX, p.vx));

    if (p.buffer > 0 && p.coyote > 0) {
      p.vy = -(JUMP_BASE + JUMP_K * Math.abs(p.vx));
      p.ground = false; p.coyote = 0; p.buffer = 0; p.dive = false;
      p.takeoff = curFloor();
      p.squash = 1.35;
      puff(p.x, p.y, 5);
    }

    p.vy += G * dt;
    p.x += p.vx * dt;
    const prevY = p.y;
    p.y += p.vy * dt;

    // duvardan sekme — yön değişimi buradan geliyor, hız neredeyse hiç düşmüyor
    if (p.x - 12 < WALL) {
      p.x = WALL+12; p.vx = Math.abs(p.vx)*WALL_KEEP; p.dir = 1;
      shake = Math.max(shake, Math.abs(p.vx)/80); puff(p.x, p.y-16, 4, 60);
    }
    if (p.x + 12 > W-WALL) {
      p.x = W-WALL-12; p.vx = -Math.abs(p.vx)*WALL_KEEP; p.dir = -1;
      shake = Math.max(shake, Math.abs(p.vx)/80); puff(p.x, p.y-16, 4, 60);
    }

    p.ground = false;
    if (p.vy > 0) {
      for (const q of plats) {
        if (prevY <= q.y + 1 && p.y >= q.y && p.x + 11 > q.x && p.x - 11 < q.x + q.w) {
          p.y = q.y; p.vy = 0; p.ground = true;
          land(q.floor); break;
        }
      }
    }

    camY = Math.min(camY, p.y - 0.62*H);
    if (maxFloor >= 5) {
      rise = Math.min(330, 30 + maxFloor*1.8);
      camY -= rise * dt;
    }
    grow();
    if (p.y - camY > H + 30) { over = true; shake = 6; }

    decay(dt);
  }

  function decay(dt){
    p.squash += (1 - p.squash) * Math.min(1, dt*14);
    shake *= Math.pow(0.001, dt);
    for (const d of dust) { d.life -= dt; d.x += d.vx*dt; d.y += d.vy*dt; d.vy += 400*dt; }
    dust = dust.filter(d => d.life > 0);
    for (const q of pops) { q.life -= dt; q.y -= 44*dt; }
    pops = pops.filter(q => q.life > 0);
  }

  function curFloor(){ return Math.round(-p.y / FLOOR_H); }

  function land(f){
    const gain = f - p.takeoff;
    if (f > maxFloor) maxFloor = f;

    if (p.dive) {                       // dalışla indin: hızını koru, hatta kazan
      p.vx = Math.max(-MAX_VX, Math.min(MAX_VX, p.vx * DIVE_GAIN));
      if (Math.abs(p.vx) < 150) p.vx = p.dir * 150;
      p.squash = 0.6; shake = Math.max(shake, 3);
      puff(p.x, p.y, 9, 260);
    } else {                            // düz indin: hız kaybı
      p.vx *= LAND_LOSS;
      p.squash = 0.75;
      puff(p.x, p.y, 3);
    }
    p.dive = false;

    if (gain >= 2) {
      p.chain = (t - p.lastLand < CHAIN_WIN) ? p.chain + 1 : 1;
      score += gain * gain * 6 * p.chain;
      if (p.chain > 1) pop(p.x, p.y - 46, 'x' + p.chain);
    } else {
      score += Math.max(0, gain);
      if (t - p.lastLand >= CHAIN_WIN) p.chain = 0;
    }
    p.lastLand = t;
    if (score > best) best = score;
  }

  // ---- çizim -----------------------------------------------------------
  function draw(){
    ctx.save(); ctx.translate((Math.random()-.5)*shake, (Math.random()-.5)*shake);

    const g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0, C.bgTop); g.addColorStop(1, C.bgBot);
    ctx.fillStyle = g; ctx.fillRect(-10,-10,W+20,H+20);

    ctx.fillStyle = C.wall;
    ctx.fillRect(0,0,WALL,H); ctx.fillRect(W-WALL,0,WALL,H);
    ctx.strokeStyle = C.wallLine; ctx.lineWidth = 2;
    const off = ((-camY) % 34);
    for (let y = off - 34; y < H; y += 34) {
      ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(WALL,y);
      ctx.moveTo(W-WALL,y+17); ctx.lineTo(W,y+17); ctx.stroke();
    }

    for (const q of plats) {
      const y = q.y - camY;
      if (y < -30 || y > H + 30) continue;
      ctx.fillStyle = C.stone; round(q.x, y, q.w, 15, 5); ctx.fill();
      ctx.fillStyle = C.stoneTop; round(q.x, y, q.w, 4, 2); ctx.fill();
      if (q.floor % 10 === 0 && q.floor > 0) {
        ctx.fillStyle = C.mark; ctx.font = '600 12px ui-monospace,monospace';
        ctx.textAlign = 'center'; ctx.fillText(q.floor, q.x + q.w/2, y + 13);
      }
    }

    for (const d of dust) {
      ctx.globalAlpha = Math.max(0, d.life*2);
      ctx.fillStyle = C.dim; ctx.fillRect(d.x-2, d.y-camY-2, 4, 4);
    }
    ctx.globalAlpha = 1;

    // dalış izi
    if (p.dive) {
      ctx.globalAlpha = .35; ctx.fillStyle = C.amber;
      round(p.x-7, p.y-camY-90, 14, 70, 7); ctx.fill();
      ctx.globalAlpha = 1;
    }

    const py = p.y - camY, sq = p.squash, w = 24/sq, h = 34*sq;
    ctx.save();
    ctx.shadowColor = C.amber; ctx.shadowBlur = 26;
    ctx.fillStyle = C.amber;
    round(p.x - w/2, py - h, w, h, 7); ctx.fill();
    ctx.restore();
    ctx.fillStyle = '#3A2408';
    ctx.fillRect(p.x - 5 + p.dir*4, py - h + 9, 3, 4);
    ctx.fillRect(p.x + 2 + p.dir*4, py - h + 9, 3, 4);

    // hız göstergesi
    const sp = Math.abs(p.vx)/MAX_VX;
    ctx.fillStyle = 'rgba(255,255,255,.10)';
    round(WALL+14, H-40, W-2*WALL-28, 8, 4); ctx.fill();
    ctx.fillStyle = C.amber;
    round(WALL+14, H-40, (W-2*WALL-28)*sp, 8, 4); ctx.fill();

    ctx.textAlign = 'left'; ctx.fillStyle = C.text;
    ctx.font = '700 30px ui-monospace,monospace'; ctx.fillText(score, WALL+16, 52);
    ctx.font = '600 12px ui-monospace,monospace'; ctx.fillStyle = C.dim;
    ctx.fillText('PUAN', WALL+16, 68);
    ctx.textAlign = 'right'; ctx.fillStyle = C.text;
    ctx.font = '700 30px ui-monospace,monospace'; ctx.fillText(maxFloor, W-WALL-16, 52);
    ctx.font = '600 12px ui-monospace,monospace'; ctx.fillStyle = C.dim;
    ctx.fillText('KAT · REKOR ' + best, W-WALL-16, 68);

    for (const q of pops) {
      ctx.globalAlpha = Math.min(1, q.life*1.6);
      ctx.fillStyle = C.amber; ctx.textAlign = 'center';
      ctx.font = '700 22px ui-monospace,monospace';
      ctx.fillText(q.txt, q.x, q.y - camY);
    }
    ctx.globalAlpha = 1;

    if (over) {
      ctx.fillStyle = 'rgba(11,9,23,.86)'; ctx.fillRect(0,0,W,H);
      ctx.textAlign = 'center'; ctx.fillStyle = C.text;
      ctx.font = '700 34px ui-monospace,monospace';
      ctx.fillText('DÜŞTÜN', W/2, H/2 - 40);
      ctx.font = '600 16px ui-monospace,monospace'; ctx.fillStyle = C.dim;
      ctx.fillText(maxFloor + '. kat · ' + score + ' puan', W/2, H/2 - 8);
      ctx.fillStyle = C.amber; ctx.font = '700 16px ui-monospace,monospace';
      ctx.fillText('yeniden başlamak için dokun', W/2, H/2 + 40);
    } else if (maxFloor === 0 && t < 7) {
      ctx.globalAlpha = Math.max(0, 1 - t/7);
      ctx.textAlign = 'center'; ctx.fillStyle = C.dim;
      ctx.font = '600 14px ui-monospace,monospace';
      ctx.fillText('yerdeyken dokun = zıpla', W/2, H/2);
      ctx.fillText('havadayken dokun = dalış', W/2, H/2 + 24);
      ctx.fillText('dalarak inersen hızını kaybetmezsin', W/2, H/2 + 48);
      ctx.globalAlpha = 1;
    }
    ctx.restore();
  }

  function round(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
  }

  let last = performance.now();
  function loop(now){
    const dt = Math.min(0.033, (now - last)/1000); last = now;
    step(dt); draw();
    requestAnimationFrame(loop);
  }
  reset(); requestAnimationFrame(loop);
})();
</script>
